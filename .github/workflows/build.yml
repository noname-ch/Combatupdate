name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # Keeps both jars, and the zip that holds them, on the run's page under Artifacts, so a
      # build can be tried without compiling it yourself. A tag starting with v also publishes
      # them as a release (see release.yml).
      - name: Upload the mod jars and the zip
        uses: actions/upload-artifact@v4
        with:
          name: Combatupdate-mods-${{ github.sha }}
          path: |
            build/distributions/*.zip
            combatupdate/build/libs/*.jar
            Gipfeliarmy/build/libs/*.jar
          if-no-files-found: error
