# Push a tag such as v1.1.0 and this builds both mods and publishes them as a GitHub release, with the
# zip and the two jars attached, so friends can download them from the Releases page.
#
#   git tag v1.1.0
#   git push origin v1.1.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/distributions/*.zip
            combatupdate/build/libs/*.jar
            Gipfeliarmy/build/libs/*.jar
          generate_release_notes: true
